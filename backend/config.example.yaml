# Terraform State Manager Backend Configuration
# Copy this file to config.yaml and update values as needed.
# All values can be overridden via environment variables with the TSM_ prefix.

server:
  port: 8080
  host: "0.0.0.0"
  mode: "release"  # debug, release, test

database:
  host: "localhost"
  port: 5432
  name: "tsm"
  user: "tsm"
  password: ""
  sslmode: "require"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

auth:
  jwt_secret: ""  # Set via TSM_AUTH_JWT_SECRET env var
  jwt_expiry: "24h"
  jwt_issuer: "terraform-state-manager"
  # Identity-schema cutover: when enabled, identity data (users, organizations,
  # API keys, OIDC config, audit logs, role templates) is read/written from the
  # shared "identity" Postgres schema instead of this app's public schema.
  # Disabled by default; reversible. The schema is created by the embedded
  # identity migrations regardless of this flag. When enabled, the system role
  # templates in the identity schema are seeded with this app's domain scopes on
  # startup (idempotent), so roles grant the same access as in the public schema.
  # Env: TSM_AUTH_IDENTITY_SCHEMA_ENABLED, TSM_AUTH_IDENTITY_SCHEMA_NAME
  identity_schema:
    enabled: false
    name: "identity"

oidc:
  enabled: false
  issuer_url: ""
  client_id: ""
  client_secret: ""  # Set via TSM_OIDC_CLIENT_SECRET env var
  redirect_url: "http://localhost:3000/callback"
  scopes:
    - openid
    - profile
    - email

# Inbound code-drift ingest (POST /api/v1/drift/ingest). A CI pipeline (e.g.
# Azure DevOps backed by Entra workload identity) presents an OIDC/ID token that
# TSM verifies against this issuer's JWKS and audience. This is a SEPARATE issuer
# from the interactive login OIDC above. When issuer is empty the endpoint is
# disabled and returns 503.
# Env: TSM_DRIFT_INGEST_OIDC_ISSUER, TSM_DRIFT_INGEST_OIDC_AUDIENCE
# NOTE: issuer/audience are placeholders pending the outbound-trigger slice that
# finalizes the real ADO/Entra values.
drift_ingest:
  oidc:
    issuer: ""
    audience: ""

# Outbound Azure DevOps plan-trigger (the other half of code-drift detection).
# TSM queues a plan pipeline run in Azure DevOps; the plan reports its results
# back via the inbound drift_ingest endpoint above. Authentication uses Workload
# Identity Federation (WIF): TSM presents a projected service-account OIDC token
# (read from wif.token_file) to the Entra token endpoint and receives an
# ADO-scoped bearer in return.
# Env: TSM_ADO_ORGANIZATION_URL, TSM_ADO_PROJECT,
#      TSM_ADO_WIF_TOKEN_ENDPOINT, TSM_ADO_WIF_CLIENT_ID,
#      TSM_ADO_WIF_SCOPE, TSM_ADO_WIF_TOKEN_FILE
# NOTE: placeholders pending AKS + the Entra tenant; the provider is mockable in
# tests. When wif.token_endpoint is empty the outbound trigger is unconfigured.
ado:
  organization_url: ""          # e.g. https://dev.azure.com/your-org
  project: ""
  wif:
    token_endpoint: ""          # e.g. https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token
    client_id: ""               # Entra application (client) id
    scope: ""                   # e.g. 499b84ac-1321-427f-aa17-267ca6975798/.default
    token_file: ""              # path to the projected SA OIDC token (e.g. /var/run/secrets/azure/tokens/ado-token)

security:
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
  setup_token: ""  # Auto-generated on first run if empty

storage:
  default_backend: "local"
  local:
    base_path: "./data"
  s3:
    bucket: ""
    region: ""
    access_key_id: ""
    secret_access_key: ""
  azure:
    account_name: ""
    container_name: ""
    account_key: ""
  gcs:
    bucket: ""
    credentials_json: ""

logging:
  level: "info"
  format: "json"  # json or text
