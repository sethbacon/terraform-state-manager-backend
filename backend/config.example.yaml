# Example configuration for the Terraform State Manager backend.
#
# Every key can be overridden by an environment variable with the TSM_ prefix and
# underscores for nesting, e.g. server.public_url -> TSM_SERVER_PUBLIC_URL,
# auth.oidc.client_secret -> TSM_AUTH_OIDC_CLIENT_SECRET. Env vars win over this file.
#
# Two secrets are intentionally NOT in this file and are read only from the
# environment (never commit them):
#   TSM_JWT_SECRET       - HMAC secret for signing session JWTs (>= 32 bytes)
#   TSM_ENCRYPTION_KEY   - 32-byte key for AES-256-GCM encryption of stored
#                          per-source credentials at rest

server:
  host: "0.0.0.0"
  port: 8080
  base_url: "http://localhost:8080"
  # Browser-facing SPA URL; used for post-login redirects and to decide whether
  # session cookies get the Secure attribute (https => Secure).
  public_url: "http://localhost:3000"
  callback_url: ""
  read_timeout: 30s
  write_timeout: 30s

database:
  host: "localhost"
  port: 5432
  name: "terraform_state_manager"
  user: "tsm"
  password: ""
  ssl_mode: "prefer"        # disable | prefer | require | verify-full
  max_connections: 25
  min_idle_connections: 5

# Identity database (users, organizations, roles, tokens). Optional: point the
# identity schema at a SEPARATE or SHARED database. Any field left unset falls
# back to the matching database.* value above, so leaving the whole block out =
# use the app database (the standalone default). Set these (TSM_IDENTITY_DATABASE_*)
# to share one identity store across the suite. When two apps share one identity
# database, set suite.role_seed_owner so exactly one app owns the role seed.
# identity_database:
#   host: ""                # => database.host
#   port: 0                 # => database.port
#   name: ""                # => database.name
#   user: ""                # => database.user
#   password: ""            # => database.password
#   ssl_mode: ""            # => database.ssl_mode
#   max_connections: 0      # => database.max_connections
#   min_idle_connections: 0 # => database.min_idle_connections

logging:
  level: "info"             # debug | info | warn | error
  format: "json"            # json | text

telemetry:
  metrics:
    enabled: true
    prometheus_port: 9090

# Periodic background workers (schedule runner + statesync reconcile loop).
# Multi-replica deployments: run exactly ONE replica with workers enabled and
# set TSM_WORKERS_ENABLED=false on the API replicas (the schedule runner has
# no cross-replica claim — two worker replicas would double-fire schedules).
# On-demand syncs (post-write refresh, source-create backfill) work on every
# replica regardless of this setting.
workers:
  enabled: true

# Directories on THIS server that a state source may reference. Two connector
# types name a server-local path in their source config: "local" (base_path) and
# "kubernetes" (an optional kubeconfig file). That config is supplied by whoever
# creates the source, so the operator declares the boundary here.
#
# Both lists FAIL CLOSED — empty (the default) permits nothing rather than
# everything, so a local source cannot be created until its root is listed. A
# base_path is accepted when it is a permitted root or lies beneath one (compared
# on whole path segments, with symlinks resolved on both sides). Entries must be
# absolute paths; TSM_STATESOURCE_LOCAL_ROOTS / TSM_STATESOURCE_KUBECONFIG_ROOTS
# take a comma-separated list.
statesource:
  local_roots: []
  #   - /data/states
  kubeconfig_roots: []
  #   - /etc/tsm/kubeconfigs

auth:
  oidc:
    enabled: false
    issuer_url: ""
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes: ["openid", "email", "profile"]
    group_claim_name: "groups"
    # Map verified IdP groups to org/role memberships. Orgs referenced here are
    # IdP-authoritative: a user's membership is reconciled on every login (and
    # revoked when they lose the group). Admin-configured; never user-supplied.
    group_mappings: []
    #   - { group: "tf-admins",  organization: "default", role: "admin" }
    #   - { group: "tf-viewers", organization: "default", role: "viewer" }
    # Role template granted in the default organization on a user's FIRST login
    # only (never overwrites an existing role) when no group mapping applies.
    default_role: ""

  # Mutual-TLS client-certificate auth (additive, machine-to-machine). Requires
  # the server to serve HTTPS (server.tls_cert_file/tls_key_file) so it can verify
  # presented client certs against client_ca_file. Only certs from a verified
  # chain are honored. When TLS is terminated by a proxy, do mTLS there instead.
  mtls:
    enabled: false
    client_ca_file: ""   # PEM bundle of trusted client-cert CAs
    mappings: []
    #   - { subject: "CN=svc-drift",            scopes: ["state:drift"] }
    #   - { subject: "dns:machine.example.com", scopes: ["state:read"] }

  # LDAP / Active Directory search-bind auth (POST /api/v1/auth/ldap/login).
  # Usernames are escaped before filter substitution; empty passwords are rejected
  # (no unauthenticated bind). Use use_tls (LDAPS) or start_tls in production and
  # keep insecure_skip_verify false. Put this endpoint behind rate limiting.
  ldap:
    enabled: false
    host: ""
    port: 0                # 0 => 636 (LDAPS) or 389
    use_tls: false
    start_tls: false
    insecure_skip_verify: false   # dev only
    base_dn: "dc=example,dc=com"
    bind_dn: "cn=svc,dc=example,dc=com"
    bind_password: ""
    user_filter: "(uid=%s)"       # %s = escaped username
    group_member_attr: "member"
    group_mappings: []
    #   - { group_dn: "cn=tf-admins,ou=groups,dc=example,dc=com", organization: "default", role: "admin" }
    default_role: ""

  # SAML 2.0 Service Provider auth. SP-initiated login: GET /api/v1/auth/login?provider=saml
  # (or saml:<idp-name>); the IdP POSTs the signed response to the ACS endpoint
  # POST /api/v1/auth/saml/acs. SP metadata is served at /api/v1/auth/saml/metadata.
  # Signatures, the XSW round-trip check, replay window and audience/recipient/
  # destination are validated; IdP-initiated SSO is OFF unless explicitly enabled.
  saml:
    enabled: false
    entity_id: ""                 # SP entity ID; defaults to acs_url without /saml/acs
    acs_url: ""                   # public URL of POST /api/v1/auth/saml/acs
    cert_file: ""                 # optional SP signing cert (PEM)
    key_file: ""                  # optional SP signing key (PEM)
    allow_idp_initiated: false    # keep false: SP-initiated only (InResponseTo bound)
    idps: []
    #   - { name: "okta", metadata_url: "https://example.okta.com/app/xxx/sso/saml/metadata" }
    #   - { name: "adfs", metadata_xml: "<EntityDescriptor ...>...</EntityDescriptor>" }
    group_attribute_name: ""      # assertion attribute carrying the user's groups
    group_mappings: []
    #   - { group: "tf-admins", organization: "default", role: "admin" }
    default_role: ""

  # SCIM 2.0 provisioning (RFC 7644) at /scim/v2 (Users + Groups). Disabled by
  # default: when off the routes are not mounted at all. When on, every endpoint
  # requires a bearer token carrying the scim:provision scope (admin satisfies it);
  # the IdP client sends Authorization: Bearer <token>. Put it behind rate limiting
  # at the proxy. Deletes/active=false deactivate (remove memberships), not destroy.
  scim:
    enabled: false

# Where authorization reads a principal's role from, and how often the two
# candidate sources are compared.
#
# Under sethbacon/terraform-suite-identity#206 identity is SHARED and
# authorization is PER-APP: membership stays a fact in the identity schema, and
# which role a member holds HERE is a row in this application's own
# organization_member_roles. "app" (the default) is that model; "identity" is the
# previous phase, where every role read came from identity.organization_members
# joined to identity.role_templates.
#
# BOTH TABLES ARE WRITTEN UNDER EITHER VALUE, so the source that is not being read
# stays current and switching back is a restart rather than a restore. That is the
# rollback: set TSM_AUTHZ_ROLE_SOURCE=identity and restart.
#
# BEFORE UPGRADING ONTO A BUILD THAT DEFAULTS TO "app", run
#   tsm-server authz-drift
# against the deployment and require a zero exit. A gap between the two sources
# does not surface as an error — it surfaces as a principal silently holding the
# wrong role.
authz:
  role_source: "app"        # app | identity  (TSM_AUTHZ_ROLE_SOURCE)
  # How often the running server re-compares the two sources and reports the
  # difference (it never corrects; the startup reconcile does that). 0 disables
  # the loop. Exports tsm_authz_role_drift{kind=...}; alert on the counts AND on
  # the age of tsm_authz_role_drift_last_check_timestamp_seconds, because a
  # detector that has stopped running reads exactly like a healthy one.
  drift_interval: 15m       # TSM_AUTHZ_DRIFT_INTERVAL

# Optional runtime coupling to the sibling suite app (the Terraform registry).
# sibling_url empty (default) = standalone; cross-app features (module freshness,
# the "Consumed by" join, audit federation) stay inert. When set, the app polls
# the sibling manifest and lights those up.
suite:
  sibling_url: ""           # base URL of the sibling registry; empty = standalone
  poll_interval: 60s        # how often the sibling manifest is re-fetched
  # Which app seeds the SHARED identity schema's system role templates:
  # self | registry | tsm. "self" (default) = each app seeds its own store
  # (correct for standalone and for separate identity DBs). When two apps SHARE
  # one identity database, exactly one must own the seed ("registry" or "tsm") or
  # they overwrite each other's role scopes on every restart.
  #
  # It NO LONGER decides what this application's own roles grant. Since
  # authz.role_source defaults to "app", this app seeds its OWN role_templates
  # unconditionally and authorizes from those; this setting now governs only the
  # shared copy, which the sibling registry and the authz rollback path still
  # read. NOTE for coupled deployments: your `editor` (and every other role name)
  # now means what THIS build defines, not what the sibling seeded.
  #
  # It is also still what the first-run setup wizard uses to decide whether this
  # app owns identity at all (owner creation, OIDC configuration), so it cannot
  # be removed until the shared authorization surface goes.
  role_seed_owner: "self"
  # Operator assertion that THIS app uses the shared identity store + single IdP.
  # Advertised in the manifest; the SPA only drops the "you may need to sign in"
  # hint when BOTH this app and the sibling assert it.
  identity_shared_store: false
  # Shared secret the sibling presents (X-Suite-Service-Token) for server-to-server
  # reads (GET /consumers). Empty leaves that endpoint disabled; set it to the SAME
  # value as the sibling registry's TFR_SUITE_SIBLING_TOKEN to enable "Consumed by".
  # Read from TSM_SUITE_SERVICE_TOKEN in production (a secret — do not commit it).
  service_token: ""

# Outbound alert delivery for drift/health run events. Channel types (webhook,
# slack, teams, email) are managed via the API/UI; the "email" channel type
# additionally requires the shared SMTP relay below (host empty = email
# channels disabled, other channel types are unaffected).
notifications:
  smtp:
    host: ""          # SMTP relay host; empty disables email channels
    port: 587          # submission/STARTTLS default
    from: ""           # From address; required when host is set
    username: ""       # optional SMTP AUTH user; enables PlainAuth
    password: ""       # optional SMTP AUTH password (read from TSM_NOTIFICATIONS_SMTP_PASSWORD)
    use_tls: true       # implicit TLS (port 465), falls back to STARTTLS on dial failure
