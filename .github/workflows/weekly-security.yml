name: Weekly Security Scan

# Complements the event-triggered scans in ci.yml (gosec, Trivy fs+image) by
# re-running the full CI plus reachability/known-vuln scanners on a fixed weekly
# cadence, so newly-disclosed CVEs in already-pinned dependencies are surfaced
# even when no code change triggers CI. Findings open tracking issues.
on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}
  # govulncheck also runs per-PR/push so a newly introduced reachable
  # vulnerability fails the PR instead of surfacing up to a week later. Every
  # other job below stays schedule/dispatch-only via an explicit `if:` — ci.yml
  # already runs per-push on its own, and osv-scan has no triage step here, so
  # gating merges on it would pin the check red on advisories with no fix.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Now that this runs per-PR, rapid pushes would otherwise stack full scans.
# Keyed on event_name so a PR run never cancels the weekly one.
concurrency:
  group: weekly-security-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every `run:` step grades its WHOLE pipeline. GitHub's unspecified default is
# `bash -e {0}`, which has NO pipefail: `check | tee log` then exits with tee's
# status and the check's failure is discarded. That is not hypothetical -- it
# kept a REQUIRED check green for two days over a package that did not compile
# (#521).
#
# The bare `bash` keyword is documented as `bash --noprofile --norc -eo pipefail
# {0}`. It is used here rather than ci.yml's explicit `bash -euo pipefail {0}`
# because this file's steps have not been audited for nounset one by one, and
# turning `-u` on is a behaviour change of a different kind that belongs in its
# own commit. The pipefail guarantee -- the one #521 is about -- is identical.
#
# internal/ci enforces this across every workflow.
defaults:
  run:
    shell: bash

jobs:
  # Re-run the full CI suite (build, tests, gosec, Trivy fs+image) on schedule.
  # ci.yml's gosec job opens an issue on new findings, so it declares issues:write.
  # A reusable-workflow call fails at startup if the caller grants less than any
  # called job requests, and this workflow's top-level default is contents:read
  # only — so grant issues:write on the calling job to satisfy ci.yml's permission
  # union (contents:read + issues:write) and avoid a startup_failure.
  ci:
    name: CI
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    # Not `secrets: inherit`, which hands the called workflow EVERY secret this
    # repository holds regardless of what it uses. ci.yml references exactly one
    # (GIST_TOKEN, for the coverage badge); GITHUB_TOKEN is ambient and is not
    # passed through this block.
    secrets:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    uses: ./.github/workflows/ci.yml

  # ── OSV Vulnerability Scan ────────────────────────────
  # Runs per-PR/push as well as weekly, now that findings are triaged: gating on
  # the raw exit code would pin the check red on advisories with no published
  # fix, which is why it was schedule-only before.
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — queries the OSV vulnerability database,
      #   whose endpoints are not enumerated until an audit run records them
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Call analysis is deliberately disabled here.
      #
      # The scanner image is built FROM a golang base, so it carries exactly one
      # Go toolchain, and the official golang images set GOTOOLCHAIN=local —
      # which forbids downloading or switching to another. It therefore cannot
      # build a module whose go directive names a newer release than the one
      # baked in. When that happens its internal govulncheck pass aborts and
      # osv-scanner exits 127 — an *error* code, distinct from the exit 1 that
      # means "vulnerabilities found" — while still reporting zero
      # vulnerabilities. `continue-on-error` collapses both into outcome=failure,
      # so the tooling error silently filed a "vulnerabilities found" issue that
      # listed nothing. That was issue #334, and it recurred on the 2026-08-10
      # run.
      #
      # RE-MEASURED 2026-08-27 at the pin below, v2.5.1, the newest release, by
      # pulling ghcr.io/google/osv-scanner-action:v2.5.1 and running the real
      # scanner: the image reports go1.26.5 while backend/go.mod declares
      # go 1.26.6, and the pass aborts with
      #   "go.mod requires go >= 1.26.6 (running go 1.26.5; GOTOOLCHAIN=local)"
      # exiting 127 with an EMPTY results array. The same invocation with the
      # flag exits 0. The note here previously said go1.26.2 in v2.3.8; that was
      # true of a pin no longer in use, and the numbers moved without the
      # conclusion changing.
      #
      # A NEWER PIN DOES NOT FIX THIS AND CANNOT: the image will always trail the
      # toolchain this module builds on. A GOTOOLCHAIN=auto override was also
      # measured and does work, and is deliberately not adopted — it duplicates
      # the govulncheck job at an older govulncheck, makes a hermetic scan depend
      # on fetching and executing a toolchain at scan time inside a root
      # container, and returns to exit 127 with an empty report whenever that
      # fetch fails.
      #
      # Nothing is lost by disabling it: reachability is the govulncheck job's job,
      # and that job resolves the toolchain from backend/go.mod, so it always
      # matches the module. This job stays responsible for the flat known-vuln
      # sweep of go.sum, which needs no toolchain at all.
      #
      # THE PAIRING IS NOW GATED, not merely described. The replay signature
      # `osv-reachability-delegation` asserts, on every push and pull request and
      # daily, that this flag stays paired with a govulncheck job that covers
      # backend/go.mod, reads its toolchain from backend/go.mod, and has its
      # result consumed rather than swallowed. Removing either half fails the
      # signature-replay check.
      - name: Run OSV-Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          # JSON (not table) so the triage step below can tell an advisory with a
          # published fix from one without; the triage step prints a
          # human-readable summary in its place.
          scan-args: |-
            --recursive
            ./backend
            --format=json
            --output=osv-results.json
            --no-call-analysis=go

      # Triaged so the issue below is filed on the same basis the PR gate uses.
      # Previously this filed an issue for ANY finding, with a body that named
      # none of them and pointed at logs that expire — so an advisory with no
      # published fix reopened a contentless issue every week.
      #
      # continue-on-error so an unfixable finding still records the report and
      # leaves the weekly run green; the exit status is read below.
      - name: Triage findings (weekly)
        id: osv_triage_weekly
        if: steps.osv.outcome == 'failure' && github.event_name == 'schedule'
        continue-on-error: true
        run: python3 backend/scripts/osv_triage.py osv-results.json --scanner-failed --issue-body osv-report.md

      - name: Create issue on new vulnerabilities
        # Only when something is actually actionable — osv_triage.py exits
        # non-zero exclusively for advisories with a published fixed version.
        # Unfixable findings still reach the job summary as warnings, and the
        # govulncheck job covers whether they are reachable.
        if: steps.osv_triage_weekly.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = 'OSV-Scanner: fixable vulnerabilities found';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security,dependencies',
            });
            if (open.some(i => i.title.startsWith(marker))) {
              core.info('An open OSV-Scanner issue already exists — skipping duplicate.');
              return;
            }
            const title = `${marker} — ${new Date().toISOString().slice(0,10)}`;
            // The report names each advisory, the package and version we
            // actually depend on, and the version it is fixed in — so the issue
            // stays actionable after the workflow logs expire.
            const report = fs.readFileSync('osv-report.md', 'utf8');
            const body = [
              report,
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'dependencies'],
            });

      - name: Triage findings — fail only when a fix is published
        # Per-PR/push runs gate the merge, but only on advisories that can
        # actually be acted on. OSV-Scanner exits non-zero for ANY known
        # vulnerability, including ones with no released fix — gating on those
        # would pin the check red until upstream ships, regardless of what the
        # PR changed, and a permanently-red required check is one everybody
        # learns to ignore.
        if: steps.osv.outcome == 'failure' && github.event_name != 'schedule'
        run: python3 backend/scripts/osv_triage.py osv-results.json --scanner-failed

  # ── govulncheck (reachability-aware scan) ─────────────
  # OSV-Scanner flags every known-vulnerable version in go.sum regardless of whether
  # this binary actually calls the vulnerable code path. govulncheck performs
  # call-graph reachability analysis so genuinely exploitable findings aren't lost
  # in the noise of unreachable transitive-dependency CVEs.
  govulncheck:
    name: govulncheck (reachability scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — downloads the Go vulnerability database
      #   and the govulncheck tool from the module proxy
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Install govulncheck
        uses: 4cloudguru/shared-workflows/.github/actions/go-install@3dac549c7e4fe4a0dc54aaf9ed187b6da2c6eab9 # v1.15.0
        with:
          package: golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        id: govulncheck
        working-directory: backend
        continue-on-error: true
        run: govulncheck -format json ./... > govulncheck-results.json

      # Triaged rather than gated on directly: govulncheck exits non-zero for
      # ANY reachable vulnerability, including one with no released fix, and
      # gating on those pins the check red until upstream ships no matter what
      # the PR changed. continue-on-error so the weekly run stays green; the
      # exit status is read below.
      - name: Triage findings (weekly)
        id: govulncheck_triage_weekly
        if: github.event_name == 'schedule'
        working-directory: backend
        continue-on-error: true
        run: python3 scripts/govulncheck_triage.py govulncheck-results.json --issue-body ../govulncheck-report.md

      - name: Create issue on new vulnerabilities
        # Only when something is actually actionable — govulncheck_triage.py
        # exits non-zero exclusively for reachable advisories with a published
        # fixed version. Unfixable ones still reach the job summary as warnings.
        if: steps.govulncheck_triage_weekly.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = 'govulncheck: fixable reachable vulnerabilities found';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security,dependencies',
            });
            if (open.some(i => i.title.startsWith(marker))) {
              core.info('An open govulncheck issue already exists — skipping duplicate.');
              return;
            }
            const title = `${marker} — ${new Date().toISOString().slice(0,10)}`;
            // The report names each advisory, the module and version we
            // actually depend on, and the version it is fixed in — so the
            // issue stays actionable after the workflow logs expire.
            const report = fs.readFileSync('govulncheck-report.md', 'utf8');
            const body = [
              report,
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'dependencies'],
            });

      - name: Triage findings — fail only when a fix is published
        # Per-PR/push runs gate the merge, but only on advisories that can
        # actually be acted on. A permanently-red required check is one
        # everybody learns to ignore; findings with no fix are surfaced as
        # warnings + job summary instead.
        if: github.event_name != 'schedule'
        working-directory: backend
        run: python3 scripts/govulncheck_triage.py govulncheck-results.json

  # ── CodeQL Analysis ───────────────────────────────────
  codeql:
    name: CodeQL Analysis (Go)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # CodeQL reads workflow-run metadata (required on private repos)
      contents: read
      security-events: write
    steps:
      # hardening-exception: egress-audit — downloads the CodeQL bundle and its
      #   query packs, which resolve to a set of endpoints this repository has never
      #   enumerated
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go

      - name: Build for CodeQL
        working-directory: backend
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:go

  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci, osv-scan, govulncheck, codeql]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      # hardening-exception: egress-audit — files an issue through the GitHub API
      #   and has no other recorded destination yet
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Weekly security scan failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Weekly Security Scan Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The scheduled weekly security scan failed. Please investigate before the next release.',
              '',
              'Common causes:',
              '- A transitive Go dependency published a breaking change or new CVE',
              '- The Docker base image changed in a breaking way',
              '- A gosec, Trivy, OSV, or govulncheck finding was introduced',
              '- CodeQL detected a new issue',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci'],
            });
