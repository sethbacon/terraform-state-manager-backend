name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {} # allows release.yml to call this

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Check go mod tidy
        working-directory: backend
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum is out of date — run 'go mod tidy' and commit the result"
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Verify swagger.json is in sync with annotations
        working-directory: backend
        # swagger.json is generated from handler swag annotations (source of truth).
        # Regenerate and fail if the committed file is stale.
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          export PATH="$PATH:$(go env GOPATH)/bin"
          swag init -g cmd/server/main.go --outputTypes json
          if ! git diff --exit-code docs/swagger.json; then
            echo "docs/swagger.json is out of date — run 'make swag' and commit the result"
            exit 1
          fi

      - name: Run Go tests (with coverage)
        working-directory: backend
        run: |
          go clean -testcache
          go test ./internal/... -race -coverprofile=coverage.out -covermode=atomic

      - name: Filter integration-only functions from coverage
        working-directory: backend
        # Functions whose doc comment carries a `coverage:skip:` marker (live
        # DB, OIDC issuer, …) are excluded from the unit-test denominator —
        # registry pattern; see scripts/coverfilter.
        run: go run ./scripts/coverfilter -in coverage.out -out coverage.filtered.out -root .

      - name: Check coverage threshold
        working-directory: backend
        # Ratchet floor: every change that touches a package should add tests and
        # raise this. The registry backend enforces 80 — that's the target.
        # History: 4 (bootstrap) → 25 → 30 → 50 → 62 → 72 → 78 (registry parity:
        # actual hit 80.0 filtered on 2026-06-11) → 79 (statesync store, 80.6)
        # → 80 (api/setup + auth/ldap tests, 80.5 filtered on 2026-07-16).
        run: |
          THRESHOLD=80
          COVERAGE=$(go tool cover -func=coverage.filtered.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Coverage (filtered): ${COVERAGE}%  (floor: ${THRESHOLD}%)"
          awk -v cov="$COVERAGE" -v thr="$THRESHOLD" 'BEGIN {
            if (cov + 0 < thr + 0) {
              print "FAIL: " cov "% is below the " thr "% floor."
              exit 1
            }
            print "PASS: " cov "% meets the " thr "% floor."
          }'

      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: backend/coverage.out

      - name: Compute coverage badge inputs
        # Only update the badge on pushes to main — not on PRs.
        if: github.event_name == 'push'
        id: badge
        working-directory: backend
        run: |
          COVERAGE=$(go tool cover -func=coverage.filtered.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "percent=${COVERAGE}" >> $GITHUB_OUTPUT
          if awk "BEGIN {exit !(${COVERAGE} >= 85)}"; then
            echo "color=brightgreen" >> $GITHUB_OUTPUT
          elif awk "BEGIN {exit !(${COVERAGE} >= 70)}"; then
            echo "color=green" >> $GITHUB_OUTPUT
          elif awk "BEGIN {exit !(${COVERAGE} >= 60)}"; then
            echo "color=yellow" >> $GITHUB_OUTPUT
          else
            echo "color=red" >> $GITHUB_OUTPUT
          fi

      - name: Update coverage badge gist
        # Requires:
        #   secrets.GIST_TOKEN  — GitHub PAT with the 'gist' scope
        #   vars.COVERAGE_GIST_ID — ID of a pre-created public gist (any file in it will do)
        # Once set, the action writes / overwrites 'coverage.json' in that gist, which the
        # shields.io endpoint badge in README.md reads. The env guard keeps
        # main green until GIST_TOKEN is configured.
        if: github.event_name == 'push' && env.GIST_TOKEN != ''
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        uses: schneegans/dynamic-badges-action@0e50b8bad39e7e1afd3e4e9c2b7dd145fad07501 # v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: Coverage
          message: ${{ steps.badge.outputs.percent }}%
          color: ${{ steps.badge.outputs.color }}

  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend
        with:
          install-gosec: "true"

      - name: Run gosec
        working-directory: backend
        # Accepted risks are suppressed inline with // #nosec <rule> -- <reason>.
        run: gosec -fmt json -out gosec-results.json ./... || true

      - name: Compare against baseline
        id: compare
        working-directory: backend
        run: |
          python3 scripts/gosec-compare.py \
            --results  gosec-results.json \
            --baseline gosec-baseline.json \
            --base-dir . \
            --output   /tmp/issue-body.md
        continue-on-error: true

      - name: Open GitHub issue for new findings
        if: steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "security"  --color "d73a4a" --description "Security finding"           --repo "$GITHUB_REPOSITORY" --force || true
          gh label create "automated" --color "0075ca" --description "Created automatically by CI"  --repo "$GITHUB_REPOSITORY" --force || true
          TITLE="security: new gosec findings on ${GITHUB_REF_NAME} ($(date -u +%Y-%m-%d))"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "security,automated" --search "gosec ${GITHUB_REF_NAME}" --json number --jq length)
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open gosec issue already exists for this branch — skipping duplicate."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue-body.md --label "security,automated"

      - name: Fail job if new findings detected
        if: steps.compare.outcome == 'failure'
        run: |
          echo "New gosec findings detected — see the GitHub issue created above."
          echo "Fix or suppress with // #nosec <rule> -- <reason>, then regenerate the baseline:"
          echo "  bash backend/scripts/update-gosec-baseline.sh"
          exit 1

      - name: Upload gosec results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gosec-results
          path: backend/gosec-results.json

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build backend Docker image
        run: docker build -t terraform-state-manager-backend:ci backend/

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Verify image starts (smoke test)
        run: |
          # Start with a bogus DB target; we only assert the entrypoint executes.
          docker run -d \
            --name tsm-smoke \
            -e TSM_DATABASE_HOST=nonexistent \
            -p 18080:8080 \
            terraform-state-manager-backend:ci || true
          sleep 5
          STATUS=$(docker inspect --format='{{.State.Status}}' tsm-smoke 2>/dev/null || echo "missing")
          echo "Container status: $STATUS"
          docker rm -f tsm-smoke 2>/dev/null || true
          if [ "$STATUS" = "missing" ]; then
            echo "Container never started — Docker build artifact broken"
            exit 1
          fi

  deployment-validate:
    name: Deployment artifacts (helm / kustomize / compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Helm lint
        run: helm lint deployments/helm

      - name: Helm template + kubeconform (default, aks, eks, gke)
        # Required-value stubs let `required` guards pass; CRD-backed kinds
        # (Gateway API, cert-manager, CSI, monitoring) skip via missing schemas.
        run: |
          set -euo pipefail
          STUBS="--set security.jwtSecret=ci0123456789abcdef0123456789abcdef \
                 --set security.encryptionKey=ci0123456789abcdef0123456789abcd \
                 --set externalDatabase.password=ci --set externalDatabase.host=db"
          for vf in "" values-aks.yaml values-eks.yaml values-gke.yaml; do
            ARGS="$STUBS"
            F=""
            if [ -n "$vf" ]; then F="-f deployments/helm/$vf"; ARGS="$ARGS --set gatewayAPI.email=ci@example.com"; fi
            echo "── profile: ${vf:-default}"
            helm template tsm deployments/helm $F $ARGS \
              | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.0 -summary
          done

      - name: CSP nonce guard (frontend header == <meta>)
        # Renders the frontend nginx ConfigMap, serves it with nginx, and asserts
        # the CSP response-header nonce equals the served <meta> nonce — guarding
        # the regression that rendered the SPA unstyled under the strict CSP.
        run: bash deployments/helm/verify-csp-nonce.sh

      - name: Kustomize build + kubeconform (5 overlays)
        run: |
          set -euo pipefail
          for ov in dev production aks eks gke; do
            echo "── overlay: $ov"
            kubectl kustomize deployments/kubernetes/overlays/$ov \
              | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.0 -summary
          done

      - name: Compose config (production)
        working-directory: deployments
        run: |
          sed -e 's|<[^>]*>|ci-placeholder|g' .env.production.example > .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config -q
          rm -f .env.production
