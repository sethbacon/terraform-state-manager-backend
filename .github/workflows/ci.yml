name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    secrets:
      GIST_TOKEN:
        # The only secret ci.yml references (GITHUB_TOKEN is ambient, not passed).
        # Optional: the coverage-badge steps are env-guarded, so a repo without
        # it simply skips them rather than failing.
        required: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# EVERY `run:` STEP IN THIS FILE GRADES ITS WHOLE PIPELINE, not just the last
# command in it.
#
# GitHub's default shell is `bash -e {0}`, which has NO pipefail. A step spelled
# `some-check | tee log` therefore exits with tee's status, and tee always
# succeeds -- so the check's failure is discarded and the step reports success.
# That is not hypothetical here: the Postgres-backed tests were a REQUIRED check
# reporting success for two days while internal/approles did not compile at all
# (#521).
#
# Set once at the workflow level rather than per step, because the defect is that
# a step can be written WITHOUT the guard. Steps that already spell
# `set -euo pipefail` in their own body keep it; it is the same setting, and a
# body that states its own contract still reads correctly if it is ever moved.
#
# internal/ci enforces this file-wide, so a new workflow cannot ship without it.
defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — Go module and tool downloads plus the
      #   coverage-badge gist call have no enumerated endpoint list yet.
      #   harden-runner has never run in this repository, so audit is what PRODUCES
      #   the list a block policy would need
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Check go mod tidy
        working-directory: backend
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum is out of date — run 'go mod tidy' and commit the result"
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # Split out of the verify step below so the install can be retried. A
      # transient module-proxy read -- "golang.org/x/tools@v0.7.0: stream error"
      # -- failed this exact step on a pull request containing zero Go changes,
      # and it was reported twice as swagger drift before the log was read.
      - name: Install swag
        uses: 4cloudguru/shared-workflows/.github/actions/go-install@9ed6d3c988fb075f1023680d92eb4cf5a8e55056 # v1.14.0
        with:
          package: github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Verify swagger.json is in sync with annotations
        working-directory: backend
        # swagger.json is generated from handler swag annotations (source of truth).
        # Regenerate and fail if the committed file is stale.
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          swag init -g cmd/server/main.go --outputTypes json
          if ! git diff --exit-code docs/swagger.json; then
            echo "docs/swagger.json is out of date — run 'make swag' and commit the result"
            exit 1
          fi

      - name: Run Go tests (with coverage)
        working-directory: backend
        run: |
          go clean -testcache
          go test ./internal/... -race -coverprofile=coverage.out -covermode=atomic

      - name: Filter integration-only functions from coverage
        working-directory: backend
        # Functions whose doc comment carries a `coverage:skip:` marker (live
        # DB, OIDC issuer, …) are excluded from the unit-test denominator —
        # registry pattern; see scripts/coverfilter.
        run: go run ./scripts/coverfilter -in coverage.out -out coverage.filtered.out -root .

      - name: Check coverage threshold
        working-directory: backend
        # Ratchet floor: every change that touches a package should add tests and
        # raise this. The registry backend enforces 80 — that's the target.
        # History: 4 (bootstrap) → 25 → 30 → 50 → 62 → 72 → 78 (registry parity:
        # actual hit 80.0 filtered on 2026-06-11) → 79 (statesync store, 80.6)
        # → 80 (api/setup + auth/ldap tests, 80.5 filtered on 2026-07-16).
        run: |
          THRESHOLD=80
          COVERAGE=$(go tool cover -func=coverage.filtered.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Coverage (filtered): ${COVERAGE}%  (floor: ${THRESHOLD}%)"
          awk -v cov="$COVERAGE" -v thr="$THRESHOLD" 'BEGIN {
            if (cov + 0 < thr + 0) {
              print "FAIL: " cov "% is below the " thr "% floor."
              exit 1
            }
            print "PASS: " cov "% meets the " thr "% floor."
          }'

      - name: Check per-package coverage floors
        working-directory: backend
        # Complements the blended-total gate above with named minimums for
        # security-critical packages (auth/*, middleware, statesource,
        # db/repositories), so a regression concentrated in one sensitive package
        # cannot hide behind the repo-wide average (#269).
        run: bash scripts/check_package_coverage.sh

      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: backend/coverage.out

      - name: Compute coverage badge inputs
        # Only update the badge on pushes to main — not on PRs.
        if: github.event_name == 'push'
        id: badge
        working-directory: backend
        run: |
          COVERAGE=$(go tool cover -func=coverage.filtered.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "percent=${COVERAGE}" >> $GITHUB_OUTPUT
          if awk "BEGIN {exit !(${COVERAGE} >= 85)}"; then
            echo "color=brightgreen" >> $GITHUB_OUTPUT
          elif awk "BEGIN {exit !(${COVERAGE} >= 70)}"; then
            echo "color=green" >> $GITHUB_OUTPUT
          elif awk "BEGIN {exit !(${COVERAGE} >= 60)}"; then
            echo "color=yellow" >> $GITHUB_OUTPUT
          else
            echo "color=red" >> $GITHUB_OUTPUT
          fi

      - name: Update coverage badge gist
        # Requires:
        #   secrets.GIST_TOKEN  — GitHub PAT with the 'gist' scope
        #   vars.COVERAGE_GIST_ID — ID of a pre-created public gist (any file in it will do)
        # Once set, the action writes / overwrites 'coverage.json' in that gist, which the
        # shields.io endpoint badge in README.md reads. The env guard keeps
        # main green until GIST_TOKEN is configured.
        if: github.event_name == 'push' && env.GIST_TOKEN != ''
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: Coverage
          message: ${{ steps.badge.outputs.percent }}%
          color: ${{ steps.badge.outputs.color }}

  # ── Postgres-backed tests (issue #394) ────────────────
  # These never ran anywhere. No workflow declares a postgres service, passes
  # -tags integration, or sets either DSN variable, so the equivalence proof
  # that gated a BREAKING authorization change (#389), the bootstrap ordering,
  # the platform-admin floor's concurrency behaviour and the migration
  # connection-leak regression test were all verified on developer machines only.
  #
  # TWO VARIABLE NAMES, and this is the trap: the three build-tagged files read
  # TEST_DATABASE_URL, while internal/db/migration_conn_leak_test.go carries NO
  # build tag and reads TSM_TEST_DATABASE_URL. A job scoped to "add -tags
  # integration" runs the first three and leaves the fourth still skipping --
  # and that fourth file is the only live proof of #342's fix, which was closed
  # on the strength of a test that had never executed. Both are set below.
  postgres-tests:
    name: Postgres-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without a health check the job races the container and every test
        # skips on an unreachable DSN -- green, and meaningless.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # hardening-exception: egress-audit — pulls the postgres:16-alpine service
      #   image in addition to Go modules, and no endpoint baseline exists yet for
      #   this repository
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Run the Postgres-backed tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TSM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        # -tags integration selects the tagged files. WHICH packages must
        # report is not restated here: backend/scripts/integration_packages.txt
        # is the one catalog, and the backstop below checks it against the tree
        # both ways. A count copied into a comment goes stale silently, which is
        # the failure mode this whole area is about. The untagged DATABASE half
        # of migration_conn_leak_test.go compiles either way and gates only on
        # its own DSN variable.
        #
        # THE PIPELINE IS GRADED, not just tee: see this workflow's `defaults`.
        # Without pipefail this step reported tee's exit status, and a package
        # that would not compile was indistinguishable from one that passed
        # (#521).
        run: go test ./internal/... -tags integration -v 2>&1 | tee /tmp/pg-tests.log

      - name: Assert the Postgres-backed suites actually ran
        working-directory: backend
        # The guard on the guard: a suite that skipped everything and a suite
        # that passed share an exit code, so assert on the transcript -- and
        # assert PER PACKAGE, on markers derived from each package's own tagged
        # files. The previous version keyed on `TestIntegration`, which six
        # packages emit, so internal/approles' siblings kept it green while
        # internal/approles did not build at all.
        #
        # And the derivation itself has a floor now. Deriving from the build tag
        # meant that editing the tag removed a package from the expected set,
        # from the transcript and from the check at once -- the same defect one
        # level up, and it exited 0. So the tag-derived set is cross-checked
        # against a by-name derivation the tag edit does not touch, and both are
        # checked against integration_packages.txt. Dropping a suite is still
        # allowed; it just has to appear in a diff.
        run: bash scripts/assert_integration_tests_ran.sh /tmp/pg-tests.log ./internal

  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — installs gosec from the Go module proxy,
      #   whose transitive fetch set is not enumerated until an audit run records it
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend
        with:
          install-gosec: "true"

      - name: Run gosec
        working-directory: backend
        # Accepted risks are suppressed inline with // #nosec <rule> -- <reason>.
        run: gosec -fmt json -out gosec-results.json ./... || true

      # The comparator is the only thing standing between a gosec run and a green

      # required check, and nothing in this repository ran its tests -- there were

      # none. A gate whose logic nothing exercises is indistinguishable from one

      # that works.

      - name: The gosec comparator's own tests

        working-directory: backend

        run: python3 scripts/gosec_compare_test.py


      - name: Compare against baseline
        id: compare
        working-directory: backend
        run: |
          python3 scripts/gosec-compare.py \
            --results  gosec-results.json \
            --baseline gosec-baseline.json \
            --base-dir . \
            --output   /tmp/issue-body.md
        continue-on-error: true

      - name: Open GitHub issue for new findings
        if: steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "security"  --color "d73a4a" --description "Security finding"           --repo "$GITHUB_REPOSITORY" --force || true
          gh label create "automated" --color "0075ca" --description "Created automatically by CI"  --repo "$GITHUB_REPOSITORY" --force || true
          TITLE="security: new gosec findings on ${GITHUB_REF_NAME} ($(date -u +%Y-%m-%d))"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "security,automated" --search "gosec ${GITHUB_REF_NAME}" --json number --jq length)
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open gosec issue already exists for this branch — skipping duplicate."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue-body.md --label "security,automated"

      - name: Fail job if new findings detected
        if: steps.compare.outcome == 'failure'
        run: |
          echo "New gosec findings detected — see the GitHub issue created above."
          echo "Fix or suppress with // #nosec <rule> -- <reason>, then regenerate the baseline:"
          echo "  bash backend/scripts/update-gosec-baseline.sh"
          exit 1

      - name: Upload gosec results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gosec-results
          path: backend/gosec-results.json

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — docker build pulls base images and
      #   layers from registries this repository has never enumerated
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend Docker image
        run: docker build -t terraform-state-manager-backend:ci backend/

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/
          severity: HIGH,CRITICAL
          # Only fail on vulnerabilities that have a fix available; un-actionable
          # (no-fix-yet) CVEs shouldn't block CI.
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Verify image starts (smoke test)
        run: |
          # Start with a bogus DB target; we only assert the entrypoint executes.
          docker run -d \
            --name tsm-smoke \
            -e TSM_DATABASE_HOST=nonexistent \
            -p 18080:8080 \
            terraform-state-manager-backend:ci || true
          sleep 5
          STATUS=$(docker inspect --format='{{.State.Status}}' tsm-smoke 2>/dev/null || echo "missing")
          echo "Container status: $STATUS"
          docker rm -f tsm-smoke 2>/dev/null || true
          if [ "$STATUS" = "missing" ]; then
            echo "Container never started — Docker build artifact broken"
            exit 1
          fi

  deployment-validate:
    name: Deployment artifacts (helm / kustomize / compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — helm, kustomize and kubeconform fetch
      #   schemas and charts from remote sources that are not yet listed
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Helm lint
        run: helm lint deployments/helm

      - name: Helm template + kubeconform (default, aks, eks, gke)
        # Required-value stubs let `required` guards pass; CRD-backed kinds
        # (Gateway API, cert-manager, CSI, monitoring) skip via missing schemas.
        run: |
          set -euo pipefail
          STUBS="--set security.jwtSecret=ci0123456789abcdef0123456789abcdef \
                 --set security.encryptionKey=ci0123456789abcdef0123456789abcd \
                 --set externalDatabase.password=ci --set externalDatabase.host=db"
          for vf in "" values-aks.yaml values-eks.yaml values-gke.yaml; do
            ARGS="$STUBS"
            F=""
            if [ -n "$vf" ]; then F="-f deployments/helm/$vf"; ARGS="$ARGS --set gatewayAPI.email=ci@example.com"; fi
            echo "── profile: ${vf:-default}"
            helm template tsm deployments/helm $F $ARGS \
              | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.0 -summary
          done

      - name: CSP nonce guard (frontend header == <meta>)
        # Renders the frontend nginx ConfigMap, serves it with nginx, and asserts
        # the CSP response-header nonce equals the served <meta> nonce — guarding
        # the regression that rendered the SPA unstyled under the strict CSP.
        run: bash deployments/helm/verify-csp-nonce.sh

      - name: Kustomize build + kubeconform (5 overlays)
        run: |
          set -euo pipefail
          for ov in dev production aks eks gke; do
            echo "── overlay: $ov"
            kubectl kustomize deployments/kubernetes/overlays/$ov \
              | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.0 -summary
          done

      - name: Compose config (production)
        working-directory: deployments
        run: |
          sed -e 's|<[^>]*>|ci-placeholder|g' .env.production.example > .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config -q
          rm -f .env.production
