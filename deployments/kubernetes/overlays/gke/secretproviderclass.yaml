# GCP Secret Manager -> tsm-secrets sync. Expects secrets named
# tsm-jwt-secret, tsm-encryption-key, tsm-database-password.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tsm-secrets-provider
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/<PROJECT_ID>/secrets/tsm-jwt-secret/versions/latest"
        path: "TSM_JWT_SECRET"
      - resourceName: "projects/<PROJECT_ID>/secrets/tsm-encryption-key/versions/latest"
        path: "TSM_ENCRYPTION_KEY"
      - resourceName: "projects/<PROJECT_ID>/secrets/tsm-database-password/versions/latest"
        path: "TSM_DATABASE_PASSWORD"
  secretObjects:
    - secretName: tsm-secrets
      type: Opaque
      data:
        - objectName: TSM_JWT_SECRET
          key: TSM_JWT_SECRET
        - objectName: TSM_ENCRYPTION_KEY
          key: TSM_ENCRYPTION_KEY
        - objectName: TSM_DATABASE_PASSWORD
          key: TSM_DATABASE_PASSWORD
