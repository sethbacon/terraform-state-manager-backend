# Azure Key Vault -> tsm-secrets sync. Expects Key Vault secrets named
# jwt-secret, encryption-key, database-password.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tsm-secrets-provider
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<AZURE_CLIENT_ID>"
    keyvaultName: "<KEY_VAULT_NAME>"
    cloudName: ""
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: jwt-secret
          objectType: secret
          objectAlias: TSM_JWT_SECRET
        - |
          objectName: encryption-key
          objectType: secret
          objectAlias: TSM_ENCRYPTION_KEY
        - |
          objectName: database-password
          objectType: secret
          objectAlias: TSM_DATABASE_PASSWORD
  secretObjects:
    - secretName: tsm-secrets
      type: Opaque
      data:
        - objectName: TSM_JWT_SECRET
          key: TSM_JWT_SECRET
        - objectName: TSM_ENCRYPTION_KEY
          key: TSM_ENCRYPTION_KEY
        - objectName: TSM_DATABASE_PASSWORD
          key: TSM_DATABASE_PASSWORD
