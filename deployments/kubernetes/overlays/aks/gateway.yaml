# ── GatewayClass (AGfC: ALB Controller must be installed) ────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: azure-alb-external
spec:
  controllerName: alb.networking.azure.io/alb-controller
---
# ── Gateway: HTTP (ACME + redirect) and HTTPS listeners ──────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tsm-gateway
  annotations:
    # az network alb show -g <RESOURCE_GROUP> -n <AGFC_NAME> --query id -o tsv
    alb.networking.azure.io/alb-id: "/subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.ServiceNetworking/trafficControllers/<AGFC_NAME>"
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: azure-alb-external
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "<HOSTNAME>"
      tls:
        mode: Terminate
        certificateRefs:
          - name: terraform-state-manager-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same
