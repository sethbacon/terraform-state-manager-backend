# AWS Secrets Manager -> tsm-secrets sync via ASCP. Expects secrets named
# tsm/jwt-secret, tsm/encryption-key, tsm/database-password.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tsm-secrets-provider
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "tsm/jwt-secret"
        objectType: "secretsmanager"
        objectAlias: "TSM_JWT_SECRET"
      - objectName: "tsm/encryption-key"
        objectType: "secretsmanager"
        objectAlias: "TSM_ENCRYPTION_KEY"
      - objectName: "tsm/database-password"
        objectType: "secretsmanager"
        objectAlias: "TSM_DATABASE_PASSWORD"
  secretObjects:
    - secretName: tsm-secrets
      type: Opaque
      data:
        - objectName: TSM_JWT_SECRET
          key: TSM_JWT_SECRET
        - objectName: TSM_ENCRYPTION_KEY
          key: TSM_ENCRYPTION_KEY
        - objectName: TSM_DATABASE_PASSWORD
          key: TSM_DATABASE_PASSWORD
