# Adds the Secrets Store CSI volume: mounting it triggers the driver to fetch
# cloud secrets and sync them into the tsm-secrets k8s Secret. The app reads
# env vars via envFrom, not the mounted files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tsm-secrets-provider
