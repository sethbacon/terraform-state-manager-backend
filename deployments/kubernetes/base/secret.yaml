# PLACEHOLDER ONLY — replace before applying, or (better) delete this resource
# in your overlay and source the same keys from a cloud secret store via the
# Secrets Store CSI Driver (see overlays/aks, overlays/eks, overlays/gke).
# Generate values:
#   TSM_JWT_SECRET:     openssl rand -hex 32
#   TSM_ENCRYPTION_KEY: openssl rand -hex 32   (64 hex chars = 32 bytes)
apiVersion: v1
kind: Secret
metadata:
  name: tsm-secrets
type: Opaque
stringData:
  TSM_JWT_SECRET: "CHANGE_ME_min_32_chars________________"
  TSM_ENCRYPTION_KEY: "CHANGE_ME_64_hex_chars________________________________________"
  TSM_DATABASE_PASSWORD: "CHANGE_ME"
