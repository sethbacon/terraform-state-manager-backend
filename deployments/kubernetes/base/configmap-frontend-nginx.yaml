# Overrides the frontend image's baked nginx config (which targets the
# docker-compose service name "backend") with the in-cluster Service DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsm-frontend-nginx
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 100m;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://tsm-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /scim/ {
            proxy_pass http://tsm-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health { proxy_pass http://tsm-backend:8080; }
        location = /ready  { proxy_pass http://tsm-backend:8080; }

        location ~ ^/swagger {
            proxy_pass http://tsm-backend:8080;
            proxy_set_header Host $host;
        }
    }
