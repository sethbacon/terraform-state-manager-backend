# ============================================================
# values-aks.yaml — AKS deployment values (PRIMARY TARGET)
# ============================================================
# Copy this file and fill in ALL <PLACEHOLDER> values before deploying.
# Do NOT commit a filled-in copy containing real secrets or IDs.
#
# Deploy with:
#   helm upgrade --install tsm ./deployments/helm \
#     --namespace terraform-state-manager --create-namespace \
#     -f deployments/helm/values-aks.yaml
#
# See docs/deployment/aks-new-cluster.md for the full walkthrough and
# docs/deployment/aks-prerequisites.md for the required Azure resources.
# ============================================================

# ── Images: your ACR FQDN, pinned tags (never 'latest') ───────────────────────
backend:
  image:
    repository: <ACR_NAME>.azurecr.io/terraform-state-manager-backend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend

# ── Dedicated worker (REQUIRED with replicaCount > 1) ─────────────────────────
workers:
  dedicated: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  enabled: true
  image:
    repository: <ACR_NAME>.azurecr.io/terraform-state-manager-frontend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2

# ── Server URLs ────────────────────────────────────────────────────────────────
server:
  # All three usually share the public hostname (must match gatewayAPI.hostname)
  publicUrl: "https://<HOSTNAME>"
  baseUrl: "https://<HOSTNAME>"
  # CI runners (GitHub-hosted / ADO Microsoft-hosted) must reach this endpoint
  # to post drift/version-lab results.
  callbackUrl: "https://<HOSTNAME>"

# ── Database: Azure Database for PostgreSQL Flexible Server ───────────────────
externalDatabase:
  host: "<AZURE_POSTGRES_SERVER>.postgres.database.azure.com"
  port: 5432
  name: "terraform_state_manager"
  user: "tsm"
  sslMode: "require"
  # Password comes from Key Vault via the CSI driver — leave blank.
  password: ""
  existingSecret: ""

# ── Auth: Entra ID (Azure AD) via OIDC ─────────────────────────────────────────
# App registration walkthrough: docs/initial-setup.md
auth:
  oidc:
    enabled: true
    issuerUrl: "https://login.microsoftonline.com/<TENANT_ID>/v2.0"
    clientId: "<APP_REGISTRATION_CLIENT_ID>"
    # Client secret comes from Key Vault (oidc-client-secret) — leave blank.
    clientSecret: ""
    redirectUrl: "https://<HOSTNAME>/api/v1/auth/callback"
    groupClaimName: "groups"
    defaultRole: "viewer"

# ── Secrets: Azure Key Vault via CSI (leave inline secrets blank) ─────────────
security:
  jwtSecret: ""
  encryptionKey: ""
  existingSecret: ""

logging:
  level: "warn"
  format: "json"

serviceAccount:
  create: true
  annotations: {}

# Managed identity needs: Key Vault Secrets User on the vault + a federated
# credential bound to this namespace/ServiceAccount.
workloadIdentity:
  enabled: true
  clientId: "<MANAGED_IDENTITY_CLIENT_ID>"

keyVault:
  enabled: true
  name: "<KEY_VAULT_NAME>"
  tenantId: "<TENANT_ID>"
  clientId: "<MANAGED_IDENTITY_CLIENT_ID>"

# ── Gateway API: Application Gateway for Containers ───────────────────────────
gatewayAPI:
  enabled: true
  gatewayClassName: azure-alb-external
  controllerName: "alb.networking.azure.io/alb-controller"
  # az network alb show -g <RG> -n <AGFC_NAME> --query id -o tsv
  albId: >-
    /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.ServiceNetworking/trafficControllers/<AGFC_NAME>
  hostname: "<HOSTNAME>"
  # letsencrypt-staging until the ACME challenge works, then letsencrypt-prod
  certManagerIssuer: "letsencrypt-staging"
  tlsSecretName: "terraform-state-manager-tls"
  email: "<OPS_EMAIL>"

ingress:
  enabled: false

networkPolicy:
  enabled: true
  prometheusNamespace: "monitoring"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true

backup:
  enabled: true
  destination: "azure"
  bucket: "<BACKUP_CONTAINER_NAME>"
