{{- if not .Values.security.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tsm.fullname" . }}
  labels:
    {{- include "tsm.labels" . | nindent 4 }}
type: Opaque
stringData:
  TSM_JWT_SECRET: {{ required "security.jwtSecret is required (or set security.existingSecret)" .Values.security.jwtSecret | quote }}
  TSM_ENCRYPTION_KEY: {{ required "security.encryptionKey is required (or set security.existingSecret)" .Values.security.encryptionKey | quote }}
  {{- if not .Values.externalDatabase.existingSecret }}
  TSM_DATABASE_PASSWORD: {{ required "externalDatabase.password is required (or set externalDatabase.existingSecret)" .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if and .Values.auth.oidc.enabled .Values.auth.oidc.clientSecret }}
  TSM_AUTH_OIDC_CLIENT_SECRET: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
  {{- if and .Values.auth.ldap.enabled .Values.auth.ldap.bindPassword }}
  TSM_AUTH_LDAP_BIND_PASSWORD: {{ .Values.auth.ldap.bindPassword | quote }}
  {{- end }}
  {{- if and .Values.notifications.smtp.host .Values.notifications.smtp.password }}
  # Optional SMTP AUTH password for the shared relay backing email channels.
  TSM_NOTIFICATIONS_SMTP_PASSWORD: {{ .Values.notifications.smtp.password | quote }}
  {{- end }}
  {{- if .Values.suite.serviceToken }}
  # Shared suite service token gating the cross-app "Consumed by" read; must
  # equal the registry's TFR_SUITE_SIBLING_TOKEN. Empty disables the feature.
  TSM_SUITE_SERVICE_TOKEN: {{ .Values.suite.serviceToken | quote }}
  {{- end }}
  {{- if .Values.setup.token }}
  # Operator-pinned first-run setup-wizard token (>= 16 chars). The backend
  # hashes this at boot instead of generating one; omit to generate + log it.
  SETUP_TOKEN: {{ .Values.setup.token | quote }}
  {{- end }}
{{- end }}
