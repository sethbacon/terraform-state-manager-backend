{{- if and .Values.keyVault.enabled .Values.secretsStore.enabled }}
{{- fail "keyVault.enabled and secretsStore.enabled are mutually exclusive." }}
{{- end }}
{{- if .Values.keyVault.enabled -}}
{{- if not .Values.keyVault.name }}
{{- fail "keyVault.name is required when keyVault.enabled=true." }}
{{- end }}
{{- if not .Values.keyVault.tenantId }}
{{- fail "keyVault.tenantId is required when keyVault.enabled=true." }}
{{- end }}
{{- if not .Values.keyVault.clientId }}
{{- fail "keyVault.clientId is required when keyVault.enabled=true." }}
{{- end }}
# Azure Key Vault → k8s Secret sync via the Secrets Store CSI Driver. Expects
# Key Vault secrets named: jwt-secret, encryption-key, database-password, and
# (when OIDC is enabled) oidc-client-secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "tsm.fullname" . }}-secrets
  labels:
    {{- include "tsm.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.keyVault.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    cloudName: ""
    objects: |
      array:
        - |
          objectName: jwt-secret
          objectType: secret
          objectAlias: TSM_JWT_SECRET
        - |
          objectName: encryption-key
          objectType: secret
          objectAlias: TSM_ENCRYPTION_KEY
        - |
          objectName: database-password
          objectType: secret
          objectAlias: TSM_DATABASE_PASSWORD
        {{- if .Values.auth.oidc.enabled }}
        - |
          objectName: oidc-client-secret
          objectType: secret
          objectAlias: TSM_AUTH_OIDC_CLIENT_SECRET
        {{- end }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
  secretObjects:
    - secretName: {{ include "tsm.secretName" . }}
      type: Opaque
      data:
        - objectName: TSM_JWT_SECRET
          key: TSM_JWT_SECRET
        - objectName: TSM_ENCRYPTION_KEY
          key: TSM_ENCRYPTION_KEY
        - objectName: TSM_DATABASE_PASSWORD
          key: TSM_DATABASE_PASSWORD
        {{- if .Values.auth.oidc.enabled }}
        - objectName: TSM_AUTH_OIDC_CLIENT_SECRET
          key: TSM_AUTH_OIDC_CLIENT_SECRET
        {{- end }}
{{- else if .Values.secretsStore.enabled }}
# Generic Secrets Store CSI provider (EKS ASCP / GKE Secret Manager). The
# provider-specific parameters and object→key mapping come verbatim from
# values (see values-eks.yaml / values-gke.yaml for working examples).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "tsm.fullname" . }}-secrets
  labels:
    {{- include "tsm.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretsStore.provider }}
  parameters:
    {{- toYaml .Values.secretsStore.parameters | nindent 4 }}
  {{- with .Values.secretsStore.secretObjects }}
  secretObjects:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
