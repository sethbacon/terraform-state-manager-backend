{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tsm.serviceAccountName" . }}
  labels:
    {{- include "tsm.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.workloadIdentity.enabled }}
    # Azure Workload Identity: the mutating webhook injects the federated OIDC
    # token into pods labeled azure.workload.identity/use: "true".
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
    {{- end }}
{{- end }}
