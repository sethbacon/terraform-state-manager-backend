apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tsm.fullname" . }}-backend
  labels:
    {{- include "tsm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tsm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "tsm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        # Azure Workload Identity: required on the pod for the mutating webhook
        # to inject the federated token. Ignored on non-AKS clusters.
        azure.workload.identity/use: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.telemetry.metrics.prometheusPort | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tsm.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- with .Values.backend.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "tsm.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.telemetry.metrics.prometheusPort }}
              protocol: TCP
          {{- include "tsm.backendEnvFrom" . | nindent 10 }}
          env:
            # Periodic workers (schedule runner + statesync loop) run in the
            # dedicated worker deployment when workers.dedicated=true; the API
            # replicas must not also run them (schedules would double-fire).
            - name: TSM_WORKERS_ENABLED
              value: {{ ternary "false" "true" .Values.workers.dedicated | quote }}
            {{- if .Values.localStates.enabled }}
            # "local" sources may only read state from directories listed here;
            # the mounted PVC is the one this chart provides.
            - name: TSM_STATESOURCE_LOCAL_ROOTS
              value: {{ .Values.localStates.mountPath | quote }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.localStates.enabled }}
            - name: local-states
              mountPath: {{ .Values.localStates.mountPath }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/tsm/tls
              readOnly: true
            {{- end }}
            {{- if or .Values.keyVault.enabled .Values.secretsStore.enabled }}
            # CSI mount triggers the Secrets Store driver to fetch cloud secrets
            # and sync them into the app's k8s Secret.
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.localStates.enabled }}
        - name: local-states
          persistentVolumeClaim:
            claimName: {{ .Values.localStates.persistence.existingClaim | default (printf "%s-states" (include "tsm.fullname" .)) }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "tls.existingSecret is required when tls.enabled=true" .Values.tls.existingSecret }}
        {{- end }}
        {{- if or .Values.keyVault.enabled .Values.secretsStore.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "tsm.fullname" . }}-secrets
        {{- end }}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
