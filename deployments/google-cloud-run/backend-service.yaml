# Cloud Run service: Terraform State Manager backend API.
# Deploy: gcloud run services replace backend-service.yaml --region=REGION
# Replace REGION / PROJECT_ID / placeholders. Secrets come from Secret Manager
# (tsm-jwt-secret, tsm-encryption-key, tsm-database-password).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tsm-backend
  labels:
    app: terraform-state-manager
    component: backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/tsm/terraform-state-manager-backend:v1.0.0
          ports:
            - name: http1
              containerPort: 8080
          env:
            - { name: TSM_SERVER_HOST, value: "0.0.0.0" }
            - { name: TSM_SERVER_PORT, value: "8080" }
            - { name: TSM_SERVER_BASE_URL, value: "https://<PUBLIC_HOSTNAME>" }
            - { name: TSM_SERVER_PUBLIC_URL, value: "https://<PUBLIC_HOSTNAME>" }
            - { name: TSM_SERVER_CALLBACK_URL, value: "https://<PUBLIC_HOSTNAME>" }
            - { name: TSM_DATABASE_HOST, value: "<CLOUD_SQL_IP_OR_DNS>" }
            - { name: TSM_DATABASE_PORT, value: "5432" }
            - { name: TSM_DATABASE_NAME, value: "terraform_state_manager" }
            - { name: TSM_DATABASE_USER, value: "tsm" }
            - { name: TSM_DATABASE_SSL_MODE, value: "require" }
            - { name: TSM_LOGGING_LEVEL, value: "warn" }
            - { name: TSM_LOGGING_FORMAT, value: "json" }
            - { name: DEV_MODE, value: "false" }
            # Cloud Run CPU is throttled off-request: periodic workers must NOT
            # run here. Deploy the dedicated tsm-worker service instead.
            - { name: TSM_WORKERS_ENABLED, value: "false" }
            - name: TSM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: tsm-database-password, key: latest }
            - name: TSM_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: tsm-jwt-secret, key: latest }
            - name: TSM_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: tsm-encryption-key, key: latest }
          resources:
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 30
