# nginx reverse proxy for a binary install: serves the SPA dist and proxies
# API paths to the backend on 127.0.0.1:8080. Pair with certbot/your CA for
# the TLS material referenced below.
server {
    listen 443 ssl;
    http2 on;
    server_name tsm.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/tsm.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tsm.yourdomain.com/privkey.pem;

    root /opt/terraform-state-manager/frontend;
    index index.html;
    client_max_body_size 100m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / { try_files $uri $uri/ /index.html; }

    location /api/  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
    location /scim/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /health { proxy_pass http://127.0.0.1:8080; }
    location = /ready  { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/swagger { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name tsm.yourdomain.com;
    return 301 https://$host$request_uri;
}
